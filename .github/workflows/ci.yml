name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Anadir linea de la feature al README
        shell: bash
        run: |
          RAMA="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          echo "Añadida feature: $RAMA" >> README.md

      - name: Commit y push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "ci: actualiza README con la nueva feature"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN (secret) con LOCAL_DEV_TOKEN (variable local)
        shell: cmd
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if "%DEV_TOKEN%"=="%LOCAL_DEV_TOKEN%" (
            echo Los tokens COINCIDEN
          ) else (
            echo Los tokens NO COINCIDEN
            exit /b 1
          )
